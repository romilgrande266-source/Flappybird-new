name: Android Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: Build APKs (arm32 + arm64)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Ensure unzip is available
        run: command -v unzip >/dev/null || (apt-get update && apt-get install -y unzip)

      - name: Unpack FlappyBirdUltimate.zip (if project is not at repo root)
        run: |
          if [ ! -f project.godot ]; then
            ZIP=$(find . -maxdepth 2 -iname "FlappyBirdUltimate*.zip" | head -n 1)
            [ -n "$ZIP" ] || { echo "No project.godot and no FlappyBirdUltimate.zip found. Upload the ZIP to the repo root."; exit 1; }
            echo "Unpacking $ZIP"
            rm -rf /tmp/proj && mkdir /tmp/proj
            unzip -q "$ZIP" -d /tmp/proj
            SRC=$(dirname "$(find /tmp/proj -name project.godot | head -n 1)")
            cp -a "$SRC"/. .
          fi

      - name: Prepare Godot + Android SDK
        run: bash tools/ci_setup.sh

      - name: Build APKs
        run: |
          mkdir -p exports
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --path . --import || true
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Android arm64" exports/FlappyBirdUltimate-arm64.apk
          godot --headless --path . --export-debug "Android arm32" exports/FlappyBirdUltimate-arm32.apk
          ls -la exports

      - name: Verify ABIs
        run: |
          L64=$(unzip -l exports/FlappyBirdUltimate-arm64.apk)
          L32=$(unzip -l exports/FlappyBirdUltimate-arm32.apk)
          echo "--- arm64 native libs ---"; grep "lib/" <<< "$L64" || true
          echo "--- arm32 native libs ---"; grep "lib/" <<< "$L32" || true
          grep -q "lib/arm64-v8a/" <<< "$L64" || { echo "arm64 APK is missing arm64-v8a libs"; exit 1; }
          grep -q "lib/armeabi-v7a/" <<< "$L32" || { echo "arm32 APK is missing armeabi-v7a libs"; exit 1; }
          echo "ABI check OK"

      - uses: actions/upload-artifact@v4
        with:
          name: FlappyBirdUltimate-apks
          path: |
            exports/FlappyBirdUltimate-arm32.apk
            exports/FlappyBirdUltimate-arm64.apk
          if-no-files-found: error

  package:
    name: Project ZIP + GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -iname "FlappyBirdUltimate*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then cp "$ZIP" FlappyBirdUltimate-project.zip
          else git archive --format=zip --prefix=FlappyBirdUltimate/ -o FlappyBirdUltimate-project.zip HEAD; fi

      - uses: actions/download-artifact@v4
        with:
          name: FlappyBirdUltimate-apks
          path: release

      - uses: actions/upload-artifact@v4
        with:
          name: FlappyBirdUltimate-project-zip
          path: FlappyBirdUltimate-project.zip

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Flappy Bird Ultimate ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/FlappyBirdUltimate-arm32.apk
            release/FlappyBirdUltimate-arm64.apk
            FlappyBirdUltimate-project.zip
