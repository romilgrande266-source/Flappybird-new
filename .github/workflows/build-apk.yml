name: Android Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    name: Build APKs (arm32 + arm64)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Read version from config.yml
        id: cfg
        run: |
          VERSION=$(awk '/^game:/{f=1;next} /^[^ #]/{f=0} f && $1=="version:"{gsub(/"/,"",$2); print $2}' config.yml)
          echo "version=${VERSION:-1.0.0}" >> "$GITHUB_OUTPUT"

      - name: Prepare Godot + Android SDK
        run: bash tools/ci_setup.sh

      - name: Ensure unzip is available
        run: command -v unzip >/dev/null || (apt-get update && apt-get install -y unzip)

      - name: Build APKs
        env:
          EXPORT_MODE: debug
        run: bash tools/build_apks.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FlappyBirdUltimate-apks
          path: |
            exports/FlappyBirdUltimate-arm32.apk
            exports/FlappyBirdUltimate-arm64.apk
          if-no-files-found: error

  package:
    name: Project ZIP + GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project ZIP
        run: git archive --format=zip --prefix=FlappyBirdUltimate/ -o FlappyBirdUltimate-project.zip HEAD

      - uses: actions/download-artifact@v4
        with:
          name: FlappyBirdUltimate-apks
          path: release

      - uses: actions/upload-artifact@v4
        with:
          name: FlappyBirdUltimate-project-zip
          path: FlappyBirdUltimate-project.zip

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Flappy Bird Ultimate ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/FlappyBirdUltimate-arm32.apk
            release/FlappyBirdUltimate-arm64.apk
            FlappyBirdUltimate-project.zip
